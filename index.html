<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F5F5F7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Daily Redeem</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Floating Apple Toast Notification -->
  <div id="toast-container" class="toast-wrapper" aria-live="polite"></div>

  <!-- Main View Container -->
  <div class="app-viewport">

    <!-- View 1: Application Selection List -->
    <section id="view-apps" class="view-section active">
      <div class="brand-header">
        <h1 class="brand-title">Daily Redeem</h1>
      </div>
      <div id="apps-grid" class="apps-grid-container"></div>
    </section>

    <!-- View 2: Redeem Codes Detail View -->
    <section id="view-redeem" class="view-section"></section>

  </div>

  <script src="app.js" defer></script>
</body>
</html>
